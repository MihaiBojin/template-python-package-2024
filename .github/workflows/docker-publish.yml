name: Publish Docker Image to GitHub Container Registry

on:
  # Trigger only on v0.* tag pushes
  push:
    tags:
      - "v0.*"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v9
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        working-directory: .
        # --locked fails the build on a stale uv.lock, rather than quietly
        # resolving something the lock file never described
        run: uv sync --all-extras --locked

      - name: Run linters
        working-directory: .
        run: uv run pre-commit run --all-files

      - name: Run tests
        working-directory: .
        run: uv run pytest tests

  push:
    # disable the workflow by default
    # uncomment when ready to publish to PyPI
    if: false

    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      # The image builds its own dependencies from uv.lock; uv is needed here
      # only so the helper scripts can read the project name.
      - name: Set up uv
        uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Build Docker image
        run: |
          source "scripts/functions.bash"
          PROJECT_NAME="$(get_project_name)"
          TAG="$(get_tag_at_head)"
          OWNER="$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')"
          make docker
          docker tag "$PROJECT_NAME:$TAG" ghcr.io/$OWNER:${{ github.sha }}
          docker tag "$PROJECT_NAME:$TAG" ghcr.io/$OWNER:$TAG
          docker tag "$PROJECT_NAME:$TAG" ghcr.io/$OWNER:latest

      - name: Push Docker image to GitHub Container Registry
        run: |
          source "scripts/functions.bash"
          TAG="$(get_tag_at_head)"
          OWNER="$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')"
          docker push ghcr.io/$OWNER:${{ github.sha }}
          docker push ghcr.io/$OWNER:$TAG
          docker push ghcr.io/$OWNER:latest
