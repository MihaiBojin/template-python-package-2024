name: Publish to PyPI

on:
  # Trigger only on v0.* tag pushes
  push:
    tags:
      - "v0.*"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        working-directory: .
        # --locked fails the build on a stale uv.lock, rather than quietly
        # resolving something the lock file never described
        run: uv sync --all-extras --locked

      - name: Run linters
        working-directory: .
        run: uv run pre-commit run --all-files

      - name: Run tests
        working-directory: .
        run: uv run pytest tests

  publish:
    # disable the workflow by default
    # uncomment when ready to publish to PyPI
    if: false

    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Set the correct (tag) version
        working-directory: .
        run: scripts/detect-and-set-tag-version.bash

      - name: Build
        working-directory: .
        run: uv build

      - name: Publish package to test repository
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.TESTPYPI_PASSWORD }}
        working-directory: .
        run: uv publish --index testpypi

      - name: Publish package
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_PASSWORD }}
        working-directory: .
        run: uv publish

      - name: Waiting 30 seconds for the PyPI indexes to be updated
        run: sleep 30

      - name: Verify package install from PyPI
        working-directory: .
        run: scripts/verify-publish.bash --prod
