name: Publish to PyPI

# Publishing uses PyPI Trusted Publishing (OIDC), so no API token is stored
# anywhere. PyPI matches the request against the repository, the workflow
# FILENAME, and the environment. Renaming this file breaks publishing with a
# confusing error — re-register the publisher on PyPI if you ever move it.
#
# See README, "Publishing to PyPI", for the one-time setup.

on:
  # Trigger only on v0.* tag pushes
  push:
    tags:
      - "v0.*"

# Least privilege by default. The publishing jobs widen this themselves.
permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        working-directory: .
        # --locked fails the build on a stale uv.lock, rather than quietly
        # resolving something the lock file never described
        run: uv sync --all-extras --locked

      - name: Run linters
        working-directory: .
        run: uv run pre-commit run --all-files

      - name: Run tests
        working-directory: .
        run: uv run pytest tests

  # Built once and handed to both publish jobs, so the artifact uploaded to
  # PyPI is byte-for-byte the one that went to TestPyPI.
  build:
    # Publishing is off in the template itself, which has nothing to release.
    # Delete this line to enable it: publish-test and publish are chained to
    # this job through `needs`, so one line gates all three.
    if: false

    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Set the correct (tag) version
        working-directory: .
        run: scripts/detect-and-set-tag-version.bash

      - name: Build
        working-directory: .
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-test:
    needs: build
    runs-on: ubuntu-latest
    # Binds this job to the trusted publisher registered for `testpypi`.
    environment: testpypi
    permissions:
      # Required: lets the job mint the OIDC token PyPI exchanges for a
      # short-lived, scoped credential. Without it uv has nothing to present.
      id-token: write
      contents: read
    steps:
      # `--index testpypi` resolves that name from [[tool.uv.index]] in
      # pyproject.toml, which is not part of the built artifact.
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish package to test repository
        # `always` rather than the default `automatic`: fail loudly if OIDC is
        # unavailable instead of silently falling back to looking for a token.
        run: uv publish --index testpypi --trusted-publishing always

  publish:
    needs: publish-test
    runs-on: ubuntu-latest
    # Binds this job to the trusted publisher registered for `pypi`. Add a
    # required reviewer on this environment if you want a manual gate before
    # anything reaches the real index.
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true

      # verify-publish.bash reads VERSION to decide which release to install,
      # and a fresh checkout still holds the committed placeholder. Run it
      # before anything else touches the tree: the script refuses a dirty one.
      - name: Set the correct (tag) version
        working-directory: .
        run: scripts/detect-and-set-tag-version.bash

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish package
        run: uv publish --trusted-publishing always

      - name: Waiting 30 seconds for the PyPI indexes to be updated
        run: sleep 30

      - name: Verify package install from PyPI
        working-directory: .
        run: scripts/verify-publish.bash --prod
