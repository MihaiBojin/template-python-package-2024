[project]
name = 'template_python_package'
license = "Apache-2.0"
description = "A starter template for Python packages."
keywords = ["python", "package", "template", "starter"]
readme = { "file" = "README.md", "content-type" = "text/markdown" }
authors = [
    { name = "Mihai Bojin", email = "557584+MihaiBojin@users.noreply.github.com" },
]
dynamic = ["version"]
dependencies = []
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
] # https://pypi.org/classifiers/

[project.optional-dependencies]
cli = []
dev = [
    # keep-sorted start
    "pre-commit==4.6.1",
    "pytest==9.1.1",
    "wheel-inspect==1.8.0",
    # keep-sorted end
]

[project.urls]
"Bug reports" = "https://github.com/MihaiBojin/template-python-package/issues/new"
"Documentation" = "https://github.com/MihaiBojin/template-python-package/blob/main/README.md"
"Source" = "https://github.com/MihaiBojin/template-python-package"

[project.scripts]
demo-cli = "template_cli_package.demo_cli:main"

# uv is the front end; hatchling stays the build backend.
# `explicit = true` keeps test.pypi out of dependency resolution: it is only
# ever addressed by name, via `uv publish --index testpypi`.
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# https://git-scm.com/docs/gitignore#_pattern_format
#
# Directories must use the '/**' form. A bare directory name loses to a
# re-inclusion in .gitignore -- '!.vscode/settings.json' there was enough to
# pull .vscode into the sdist despite a '.vscode' entry here.
exclude = [
    # keep-sorted start
    ".devcontainer/**",
    ".dockerignore",
    ".env",
    ".github/**",
    ".pre-commit-config.yaml",
    ".python-version",
    ".vscode/**",
    "Dockerfile",
    "Makefile",
    "renovate.json",
    "scripts/**",
    "tests/**",
    "uv.lock",
    # keep-sorted end

    # If you want to include any scripts, list them below
    # keep-sorted start
    "!scripts/verify-publish.bash",
    # keep-sorted end
]

[tool.hatch.build.targets.wheel]
packages = ["src/template_package", "src/template_cli_package"]

[tool.hatch.version]
path = "./VERSION"
pattern = "(?P<version>.+)"

[tool.mypy]
# keep-sorted start
check_untyped_defs = true
disallow_untyped_calls = true
namespace_packages = false
pretty = true
show_column_numbers = true
show_error_codes = true
warn_no_return = false
warn_unused_ignores = true
# keep-sorted end

# Add per-package mypi configurations, if needed
#[[tool.mypy.overrides]]
#module = '[NAME].*'
